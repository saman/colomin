name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Shared tag-version check (fails fast across all platforms) ──────────────
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify
        run: |
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION."
            exit 1
          fi

  # ── macOS: universal .app + .dmg, signed + notarized ───────────────────────
  build-macos:
    name: macOS universal (.dmg + .app)
    runs-on: macos-14
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create -output target/release/colomin \
            target/aarch64-apple-darwin/release/colomin \
            target/x86_64-apple-darwin/release/colomin
          lipo -info target/release/colomin

      # Preflight: signing and notarization are gated on the presence of
      # secrets. `secrets.*` can't be used in `if:`, so we surface them as step
      # outputs via env-loaded checks. Notarization is *additionally* skipped
      # for `-rc*` tags so iterating on the cross-platform pipeline doesn't
      # burn Apple's notary queue. Final tags (v0.2.0 etc.) still notarize.
      - name: Preflight signing config
        id: pre
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          P8:   ${{ secrets.AC_API_KEY_P8 }}
        run: |
          [ -n "$CERT" ] && echo "has_cert=true" >> "$GITHUB_OUTPUT"
          if [ -n "$P8" ] && [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "Notarization skipped: $GITHUB_REF_NAME is an rc tag or no key configured."
          fi

      # Write the App Store Connect API key to disk so cargo-packager can read
      # it via APPLE_API_KEY_PATH during notarization.
      - name: Materialize notary API key
        if: ${{ steps.pre.outputs.has_key == 'true' }}
        id: notary
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${AC_API_KEY_ID}.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # Export notarization env vars only when has_key is true. Setting any of
      # APPLE_API_KEY/_ISSUER/_KEY_PATH to an empty string still trips
      # cargo-packager into attempting notarization (it sees var-is-set, then
      # fails on the empty path). $GITHUB_ENV is the only way to *not* set them
      # at all in the next step.
      - name: Export notarization env (when has_key)
        if: ${{ steps.pre.outputs.has_key == 'true' }}
        env:
          KEY_ID:    ${{ secrets.AC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
          KEY_PATH:  ${{ steps.notary.outputs.key_path }}
        run: |
          echo "APPLE_API_KEY=$KEY_ID"        >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$ISSUER_ID"  >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # cargo-packager reads APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD to
      # import the signing cert into a temp keychain itself. Notarization picks
      # up APPLE_API_KEY/_ISSUER/_KEY_PATH from the env exported above (only
      # set when has_key is true).
      - name: Package (.app + .dmg, signed; notarized when has_key)
        env:
          APPLE_CERTIFICATE:          ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: cargo packager --release --formats app,dmg

      - name: Rename DMG to stable asset name
        run: |
          mv dist/*.dmg dist/Colomin.dmg
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-macos-universal
          path: dist/Colomin.dmg

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Colomin.dmg
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Linux: .deb + .AppImage ────────────────────────────────────────────────
  build-linux:
    name: Linux (.deb + .AppImage)
    runs-on: ubuntu-22.04
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # eframe runtime deps (GTK + xkbcommon + fontconfig + Wayland/X11 baseline)
      # plus AppImage tooling (fuse for AppImage runtime, file utils).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libwayland-dev libxcb1-dev libx11-dev \
            file fuse libfuse2 desktop-file-utils

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release
        run: cargo build --release

      - name: Package (.deb + .AppImage)
        run: cargo packager --release --formats deb,appimage

      - name: Rename artifacts to stable asset names
        run: |
          mv dist/*.deb dist/Colomin.deb
          mv dist/*.AppImage dist/Colomin-x86_64.AppImage
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-linux
          path: |
            dist/Colomin.deb
            dist/Colomin-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Colomin.deb
            dist/Colomin-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Windows: .msi via WiX ──────────────────────────────────────────────────
  build-windows:
    name: Windows (.msi)
    runs-on: windows-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # WiX/MSI versions must be `major.minor.patch[.build]` with every
      # component numeric (and ≤ 65535). Cargo accepts SemVer prereleases like
      # "0.2.0-rc1" but WiX rejects them. Strip any prerelease/build suffix
      # from Cargo.toml's `version = "..."` line *for the MSI build only*.
      # The .deb / .AppImage / .dmg builds use the unmodified version from
      # main / their own runners, so cross-arch parity is preserved.
      - name: Patch version for MSI (strip prerelease suffix)
        shell: pwsh
        run: |
          $path = "Cargo.toml"
          $content = Get-Content $path -Raw
          $patched = $content -replace '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)(?:-[^"]+)?"', 'version = "$1"'
          Set-Content -Path $path -Value $patched -NoNewline
          Get-Content $path | Select-String '^version' | Select-Object -First 1

      - name: Build release
        run: cargo build --release

      - name: Package (.msi)
        run: cargo packager --release --formats wix

      - name: Rename MSI to stable asset name
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          Move-Item $msi.FullName dist\Colomin.msi
          Get-ChildItem dist\

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-windows
          path: dist/Colomin.msi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Colomin.msi
          draft: false
          prerelease: false
          generate_release_notes: true
