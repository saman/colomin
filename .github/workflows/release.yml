name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS universal DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION. Bump Cargo.toml and retag."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create -output target/release/colomin \
            target/aarch64-apple-darwin/release/colomin \
            target/x86_64-apple-darwin/release/colomin
          lipo -info target/release/colomin

      - name: Bundle .app
        env:
          SKIP_BUILD: "1"
        run: ./scripts/bundle.sh

      # ----- Code signing & notarization -----
      # All steps below are skipped when the Apple secrets are not configured,
      # so unsigned builds still publish. Once MACOS_CERTIFICATE and the
      # AC_API_KEY_* secrets are set, signing and notarization activate
      # automatically. See docs/NOTARIZATION.md for setup.

      - name: Set up signing keychain
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        id: keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/sign.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERTIFICATE" | base64 -d > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PWD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in imported cert."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Imported identity: $IDENTITY"

      - name: Set up notary API key
        if: ${{ secrets.AC_API_KEY_P8 != '' }}
        id: notary
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${AC_API_KEY_ID}.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Sign .app
        if: ${{ steps.keychain.outputs.identity != '' }}
        env:
          SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/sign-app.sh target/release/Colomin.app

      - name: Notarize and staple .app
        if: ${{ steps.keychain.outputs.identity != '' && steps.notary.outputs.key_path != '' }}
        env:
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
        run: ./scripts/notarize.sh target/release/Colomin.app

      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGING="$(mktemp -d)/dmg"
          mkdir -p "$STAGING"
          cp -R "target/release/Colomin.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          # Keep the asset name stable so /releases/latest/download/Colomin.dmg
          # always resolves. The version lives in the release name/tag.
          DMG_PATH="Colomin.dmg"
          hdiutil create \
            -volname "Colomin ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Sign DMG
        if: ${{ steps.keychain.outputs.identity != '' }}
        env:
          SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/sign-app.sh "$DMG_PATH"

      - name: Notarize and staple DMG
        if: ${{ steps.keychain.outputs.identity != '' && steps.notary.outputs.key_path != '' }}
        env:
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
        run: ./scripts/notarize.sh "$DMG_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colomin-macos-universal
          path: ${{ env.DMG_PATH }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
