name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Shared tag-version check (fails fast across all platforms) ──────────────
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify
        run: |
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION."
            exit 1
          fi

  # ── macOS: universal .app + .dmg, signed + notarized ───────────────────────
  build-macos:
    name: macOS universal (.dmg + .app)
    runs-on: macos-14
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create -output target/release/colomin \
            target/aarch64-apple-darwin/release/colomin \
            target/x86_64-apple-darwin/release/colomin
          lipo -info target/release/colomin

      # Preflight: tagged macOS releases must fail closed. Without every value
      # below, cargo-packager would either skip signing/notarization or fail
      # late after producing misleading logs.
      - name: Preflight signing and notarization config
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_KEY_ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            MACOS_SIGNING_IDENTITY \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PWD \
            AC_API_KEY_P8 \
            AC_API_KEY_ID \
            AC_API_KEY_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub secret is required for signed and notarized macOS releases."
              missing=1
            fi
          done

          placeholder='Developer ID Application: YOUR_NAME_OR_ORG (TEAMID)'
          if [ "${MACOS_SIGNING_IDENTITY:-}" = "$placeholder" ]; then
            echo "::error::Replace the MACOS_SIGNING_IDENTITY placeholder with your Developer ID Application identity."
            missing=1
          elif ! printf '%s\n' "${MACOS_SIGNING_IDENTITY:-}" | grep -Eq '^Developer ID Application: .+ \([A-Z0-9]{10}\)$'; then
            echo "::error::MACOS_SIGNING_IDENTITY must look like: Developer ID Application: Name (TEAMID)."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Write the App Store Connect API key to disk so cargo-packager can read
      # it via APPLE_API_KEY_PATH during notarization.
      - name: Materialize notary API key
        id: notary
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${AC_API_KEY_ID}.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Export notarization env
        env:
          KEY_ID:    ${{ secrets.AC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.AC_API_KEY_ISSUER_ID }}
          KEY_PATH:  ${{ steps.notary.outputs.key_path }}
        run: |
          echo "APPLE_API_KEY=$KEY_ID"        >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$ISSUER_ID"  >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # cargo-packager 0.11.x only signs/notarizes macOS apps when the
      # `signing-identity` field exists in the packager config. Keep the repo
      # config identity-free for local unsigned packaging, then inject the real
      # Developer ID identity only inside the release runner.
      - name: Inject macOS signing identity
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          ruby -0777 -i -pe '
            identity = ENV.fetch("MACOS_SIGNING_IDENTITY")
            replacement = "[package.metadata.packager.macos]\nminimum-system-version = \"12.0\"\nsigning-identity = #{identity.dump}\n"
            unless $_.sub!(/\[package\.metadata\.packager\.macos\]\nminimum-system-version = "12\.0"\n/, replacement)
              abort("failed to inject macOS signing identity into Cargo.toml")
            end
          ' Cargo.toml
          grep -A2 '^\[package.metadata.packager.macos\]' Cargo.toml

      # cargo-packager reads APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD to
      # import the signing cert into a temp keychain itself. Notarization picks
      # up APPLE_API_KEY/_ISSUER/_KEY_PATH from the env exported above.
      - name: Package (.app + .dmg, signed + app-notarized)
        env:
          APPLE_CERTIFICATE:          ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: cargo packager --release --formats app,dmg

      - name: Rename DMG to stable asset name
        run: |
          mv dist/*.dmg dist/Colomin.dmg
          ls -la dist/

      # The release asset is the DMG, so notarize and staple that final
      # container too. cargo-packager already notarizes the .app bundle.
      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit dist/Colomin.dmg \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v dist/Colomin.dmg

      - name: Verify macOS signatures and notarization tickets
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Colomin.app
          spctl -a -vvv -t exec dist/Colomin.app
          xcrun stapler validate dist/Colomin.app
          codesign --verify --verbose=2 dist/Colomin.dmg
          spctl -a -vvv -t open --context context:primary-signature dist/Colomin.dmg
          xcrun stapler validate dist/Colomin.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-macos-universal
          path: dist/Colomin.dmg

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Colomin.dmg
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Linux: .deb + .AppImage + .rpm (x86_64 + arm64) ────────────────────────
  # Two native runners — no cross-compilation. GitHub Actions ships free arm64
  # Linux runners since 2025 (`ubuntu-22.04-arm`). Each job produces a .deb,
  # .AppImage, and .rpm matching its host architecture.
  #
  # cargo-packager doesn't have an RPM backend; we use `cargo-generate-rpm`
  # for that (configured under [package.metadata.generate-rpm] in Cargo.toml).
  build-linux:
    name: Linux ${{ matrix.arch }} (.deb + .AppImage + .rpm)
    runs-on: ${{ matrix.runner }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            # cargo-packager appends `_amd64` to .deb names and `_x86_64` to .AppImage.
            deb_pattern: "*amd64.deb"
            deb_asset: "Colomin.deb"
            appimage_pattern: "*x86_64.AppImage"
            appimage_asset: "Colomin-x86_64.AppImage"
            rpm_pattern: "*x86_64.rpm"
            rpm_asset: "Colomin.rpm"
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_pattern: "*arm64.deb"
            deb_asset: "Colomin-arm64.deb"
            appimage_pattern: "*aarch64.AppImage"
            appimage_asset: "Colomin-aarch64.AppImage"
            rpm_pattern: "*aarch64.rpm"
            rpm_asset: "Colomin-arm64.rpm"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # eframe runtime deps (GTK + xkbcommon + fontconfig + Wayland/X11 baseline)
      # plus AppImage tooling (fuse for AppImage runtime, file utils).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libwayland-dev libxcb1-dev libx11-dev \
            file fuse libfuse2 desktop-file-utils

      - name: Install packagers
        run: cargo install cargo-packager cargo-generate-rpm --locked

      - name: Build release
        run: cargo build --release

      - name: Package (.deb + .AppImage)
        run: cargo packager --release --formats deb,appimage

      # RPM versions disallow `-` (it separates Version from Release in the
      # filename). Cargo SemVer prereleases like "0.2.0-rc7" must be rewritten
      # as "0.2.0~rc7" (tilde = RPM "less than the un-suffixed version", which
      # is the correct prerelease ordering). Patch happens after .deb / .AppImage
      # are produced, so those keep the unmodified SemVer.
      - name: Patch version for RPM (replace `-` with `~`)
        run: |
          sed -i -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)-(.+)"/version = "\1~\2"/' Cargo.toml
          grep '^version' Cargo.toml | head -1

      - name: Package (.rpm)
        run: |
          cargo generate-rpm
          # cargo-generate-rpm writes to target/generate-rpm/<name>-<ver>-1.<arch>.rpm.
          # Move it next to the cargo-packager outputs so the rename step below
          # finds everything in dist/.
          mv target/generate-rpm/*.rpm dist/

      - name: Rename artifacts to stable asset names
        run: |
          mv dist/${{ matrix.deb_pattern }}      dist/${{ matrix.deb_asset }}
          mv dist/${{ matrix.appimage_pattern }} dist/${{ matrix.appimage_asset }}
          mv dist/${{ matrix.rpm_pattern }}      dist/${{ matrix.rpm_asset }}
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-linux-${{ matrix.arch }}
          path: |
            dist/${{ matrix.deb_asset }}
            dist/${{ matrix.appimage_asset }}
            dist/${{ matrix.rpm_asset }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.deb_asset }}
            dist/${{ matrix.appimage_asset }}
            dist/${{ matrix.rpm_asset }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Windows: .msi (x86_64) + portable .zip (both archs) ────────────────────
  # Both archs build on `windows-latest` (x86_64). x86_64 produces a .msi via
  # WiX plus a portable .zip. arm64 cross-compiles to `aarch64-pc-windows-msvc`
  # and ships *only* the portable .zip — cargo-packager bundles WiX 3.11.2
  # (2017) which can't reliably produce arm64 MSIs (neither natively on
  # `windows-11-arm` nor via cross-compile from x86_64). Snapdragon users
  # extract the .zip and run colomin.exe directly; the binary is fully native
  # arm64.
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    needs: verify-version
    # Static CRT so the portable .exe runs on stock Windows without needing
    # the VC++ Redistributable installed. Adds ~1 MB to the binary; trivial.
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            # x86_64 is the runner's native arch — use default cargo paths
            # (target/release/) so cargo-packager finds the binary without
            # needing an explicit --target flag.
            cargo_target_flag: ""
            exe_path: "target/release/colomin.exe"
            build_msi: true
            msi_pattern: "*x64*.msi"
            msi_asset: "Colomin.msi"
            zip_asset: "Colomin-portable-x86_64.zip"
          - arch: arm64
            target: aarch64-pc-windows-msvc
            cargo_target_flag: "--target aarch64-pc-windows-msvc"
            exe_path: "target/aarch64-pc-windows-msvc/release/colomin.exe"
            build_msi: false
            zip_asset: "Colomin-portable-arm64.zip"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Install cargo-packager
        if: ${{ matrix.build_msi }}
        run: cargo install cargo-packager --locked

      # WiX/MSI versions must be `major.minor.patch[.build]` with every
      # component numeric (and ≤ 65535). Cargo accepts SemVer prereleases like
      # "0.2.0-rc1" but WiX rejects them. Strip any prerelease/build suffix
      # from Cargo.toml's `version = "..."` line *for the MSI build only*.
      # The .deb / .AppImage / .dmg / .rpm builds use the unmodified version
      # from their own runners, so cross-arch parity is preserved.
      - name: Patch version for MSI (strip prerelease suffix)
        if: ${{ matrix.build_msi }}
        shell: pwsh
        run: |
          $path = "Cargo.toml"
          $content = Get-Content $path -Raw
          $patched = $content -replace '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)(?:-[^"]+)?"', 'version = "$1"'
          Set-Content -Path $path -Value $patched -NoNewline
          Get-Content $path | Select-String '^version' | Select-Object -First 1

      - name: Build release
        run: cargo build --release ${{ matrix.cargo_target_flag }}

      - name: Package (.msi)
        if: ${{ matrix.build_msi }}
        run: cargo packager --release --formats wix

      - name: Rename MSI to stable asset name
        if: ${{ matrix.build_msi }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\${{ matrix.msi_pattern }} | Select-Object -First 1
          Move-Item $msi.FullName dist\${{ matrix.msi_asset }}

      # Portable distribution: just colomin.exe in a .zip. No installer, no
      # registry entries, no Start Menu — users extract and run. Statically
      # linked CRT (via RUSTFLAGS above) means it works on any Windows 10+.
      - name: Package portable .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path ${{ matrix.exe_path }} `
            -DestinationPath dist\${{ matrix.zip_asset }}
          Get-ChildItem dist\

      - uses: actions/upload-artifact@v4
        with:
          name: Colomin-windows-${{ matrix.arch }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
